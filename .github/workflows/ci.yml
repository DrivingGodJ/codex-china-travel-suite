name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugins/codex-china-travel-suite/package-lock.json
      - run: npm ci --prefix plugins/codex-china-travel-suite
      - run: npm run check --prefix plugins/codex-china-travel-suite
      - run: npm test --prefix plugins/codex-china-travel-suite
